name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint --if-present

      - run: npm run build

  e2e-tests:
    name: E2E Tests
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          repository: LucasMCFidelis/ethos-qa
          path: cypress-tests

      - name: Wait for API
        uses: ./cypress-tests/.github/actions/wait-for-api
        with:
          url: ${{ vars.API_URL_DEV }}/health

      - name: Start Frontend
        env:
          VITE_API_URL: ${{ vars.API_URL_DEV }}
        run: |
          npm run dev -- --host 0.0.0.0 &
          npx wait-on http://localhost:8080

      - name: Run QA Suite
        uses: ./cypress-tests/.github/actions/run-cypress
        with:
          qa_path: cypress-tests
          base_url: http://localhost:8080
          api_url: ${{ vars.API_URL_DEV }}
          smoke_command: npm run cy:e2e -- --expose grepTags=@smoke
          regression_command: npm run cy:e2e -- --expose grepTags="-@smoke"

  deploy-dev:
    name: Deploy Dev
    needs: [ci, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEV }}
        run: curl "$deploy_url"
